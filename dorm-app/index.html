<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="description" content="晚寝自动签到 · 到点自动定位打卡，失败重试并留痕" />
    <title>晚寝签到</title>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/alimama-700.woff2" crossorigin />
    <style>

      @font-face {
        font-family: "Alimama ShuHeiTi";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/alimama-700.woff2") format("woff2");
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }
      #bs-fly {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding-bottom: 36px;
        pointer-events: none;
      }

      #boot-splash .bs-veil {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-color: #bef22f;
        transition: opacity 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      #boot-splash.bs-out .bs-veil {
        opacity: 0;
      }

      #boot-splash.bs-out {
        pointer-events: none;
      }

      #bs-fly.bs-out .bs-sub { animation: bsDrop 0.2s cubic-bezier(0.2, 0, 0, 1) both; }
      #bs-fly.bs-out .bs-bar { animation: bsDrop 0.18s cubic-bezier(0.2, 0, 0, 1) both; }
      @keyframes bsDrop {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      #bs-fly svg {
        display: block;
        margin-bottom: 22px;
        transform-origin: center;

        will-change: transform;
        animation: bsPop 0.9s cubic-bezier(0.34, 1.18, 0.64, 1) both;
      }
      #bs-fly .bs-word {

        font-family: "Alimama ShuHeiTi", "Noto Sans SC", system-ui, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 10px;
        padding-left: 10px;

        line-height: normal;
        color: #1a1a1a;
        white-space: nowrap;
        will-change: transform;
        animation: bsRise 0.7s cubic-bezier(0.2, 0, 0, 1) 0.18s both;
      }
      #bs-fly .bs-sub {
        margin-top: 10px;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 5px;
        padding-left: 5px;
        color: rgba(26, 26, 26, 0.5);
        animation: bsRise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.32s both;
      }
      #bs-fly .bs-bar {
        position: absolute;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        width: 64px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(26, 26, 26, 0.12);
        animation: bsFade 0.5s ease 0.6s both;
      }
      #boot-splash .bs-bar i {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: rgba(26, 26, 26, 0.5);
        animation: bsSlide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes bsPop {
        0% { opacity: 0; transform: scale(0.6) translateY(6px); filter: blur(8px); }
        55% { opacity: 1; filter: blur(0); }
        100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
      }
      @keyframes bsRise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bsFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes bsSlide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash *, #bs-fly * { animation: none !important; }
      }
    </style>
  </head>
  <body style="margin: 0; background: #bef22f">
    <div id="root"></div>
    <script>

      (function () {
        try {
          if (/[?&]flat\b/.test(location.search)) return;

          document.documentElement.dataset.handoff = "1";

          var veil = document.createElement("div");
          veil.id = "boot-splash";
          veil.setAttribute("aria-hidden", "true");
          veil.innerHTML = '<i class="bs-veil"></i>';
          document.body.appendChild(veil);

          var fly = document.createElement("div");
          fly.id = "bs-fly";
          fly.setAttribute("aria-hidden", "true");
          fly.innerHTML =
            '<svg id="bs-logo" viewBox="0 0 107 128" width="107" height="128" fill="none"><path fill="#1A1A1A" d="M15.5626 90.0426L14.4934 88.9364C2.1728 75.9639 -2.8166 57.9131 1.5619 40.0634C6.5512 19.4986 24.2176 3.6601 45.3968 0.593C78.4894 -4.234 107 21.0573 107 52.8348C107 68.9246 96.8686 87.3274 83.7843 97.7858C82.1042 99.1434 79.6095 98.8417 78.184 97.2327L65.9652 83.7072C64.0814 81.6959 64.5396 78.4277 66.9834 77.0701C73.8056 73.1482 79.1513 66.8128 80.8823 59.1701C85.3625 39.2086 67.9507 21.7109 47.7897 25.7334C37.1491 27.8452 28.4941 36.2421 26.1522 46.7005C24.1157 55.9522 26.7631 65.1536 33.0762 71.6901L36.5382 75.26L36.4364 75.3606L68.7653 109.501C70.3945 111.211 70.2927 113.976 68.5617 115.585L56.4447 126.798C54.6119 128.457 51.7608 128.407 50.0807 126.597L15.6135 90.1934L15.5626 90.0426Z"/></svg>' +
            '<div class="bs-word">晚寝签到</div>' +
            '<div class="bs-sub">NIGHT · CHECK-IN</div>' +
            '<div class="bs-bar"><i></i></div>';
          document.body.appendChild(fly);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
