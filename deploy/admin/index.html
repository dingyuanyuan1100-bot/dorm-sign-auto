<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>意见反馈 · 管理后台</title>
<style>
  :root{
    --cream:#F3F0E8; --lime:#C6E844; --lime-deep:#9BC426; --ink:#111214;
    --gray:#5A5D60; --line:#E3DFD2; --card:#FFFFFF; --danger:#C8443C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .mark{width:38px;height:38px;border-radius:12px;background:var(--lime);
        display:grid;place-items:center;font-weight:800;font-size:17px;
        box-shadow:2px 2px 0 var(--ink)}
  h1{font-size:20px;margin:0;letter-spacing:.5px}
  .sub{margin:2px 0 0;color:var(--gray);font-size:12px}
  .badge{margin-left:auto;padding:5px 11px;border:1.5px solid var(--ink);border-radius:99px;
         font-size:11px;font-weight:700;background:#fff}

  .gate{max-width:390px;margin:12vh auto 0;background:var(--card);border:2px solid var(--ink);
        border-radius:18px;padding:30px;box-shadow:5px 5px 0 var(--ink)}
  .gate h2{margin:0 0 6px;font-size:19px}
  .gate p{margin:0 0 20px;color:var(--gray);font-size:12px}
  .field{width:100%;padding:11px 13px;border:1.5px solid var(--ink);border-radius:10px;
         background:#fff;outline:none}
  .field:focus{box-shadow:0 0 0 3px rgba(198,232,68,.55)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
       padding:10px 18px;border:1.5px solid var(--ink);border-radius:10px;background:var(--lime);
       font-weight:700;transition:transform .12s ease,box-shadow .12s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .btn[disabled]{opacity:.55;cursor:wait;transform:none;box-shadow:none}
  .btn.ghost{background:#fff}
  .btn.wide{width:100%;margin-top:14px}
  .hintline{margin-top:12px;font-size:12px;color:var(--danger);min-height:18px}

  .stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;
        padding:11px 17px;min-width:112px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{font-size:11px;color:var(--gray)}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:7px 15px;border:1.5px solid var(--ink);border-radius:99px;background:#fff;
       font-size:12px;font-weight:700}
  .tab[data-on="true"]{background:var(--ink);color:#fff}
  .spacer{flex:1}

  .cols{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.15fr);gap:16px;align-items:start}
  .panel{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
  .panel h3{margin:0;padding:13px 16px;border-bottom:1.5px solid var(--ink);font-size:13px;
            background:#FBF9F2;display:flex;align-items:center;gap:8px}
  .panel h3 .muted{margin-left:auto;color:var(--gray);font-weight:400;font-size:11px}
  .list{max-height:640px;overflow:auto}
  .item{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);
        transition:background .12s}
  .item:hover{background:#FAF8EF}
  .item[data-on="true"]{background:#F2F9D8;box-shadow:inset 3px 0 0 var(--lime-deep)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .code{font-size:12px;font-weight:800;letter-spacing:.4px}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--cream);border:1px solid var(--line)}
  .pill{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
        border:1.5px solid var(--ink);background:#fff}
  .pill[data-s="replied"]{background:var(--lime);border-color:var(--lime-deep)}
  .excerpt{font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{margin-top:5px;font-size:11px;color:#8A8C8F}
  .empty{padding:36px 16px;text-align:center;color:var(--gray);font-size:12px}

  .detail{padding:16px}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .kv div{background:#FBF9F2;border-radius:9px;padding:8px 10px}
  .kv small{display:block;color:var(--gray);font-size:10px}
  .kv b{font-size:12px;font-weight:700;word-break:break-all}
  .label{font-size:11px;font-weight:700;color:var(--gray);margin:0 0 6px}
  .content{white-space:pre-wrap;word-break:break-word;background:#FBF9F2;border-radius:9px;
           padding:12px;margin:0 0 16px;font-size:13px;min-height:52px}
  .shots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .shots img{width:88px;height:88px;object-fit:cover;border:1.5px solid var(--ink);
             border-radius:8px;cursor:zoom-in;background:#fff}
  .replybox{border-top:1.5px dashed var(--line);padding-top:14px}
  .replybox textarea{width:100%;min-height:88px;resize:vertical;border:1.5px solid var(--ink);
                     border-radius:10px;padding:10px;font:inherit;font-size:13px;outline:none}
  .replybox textarea:focus{box-shadow:0 0 0 3px rgba(198,232,68,.55)}
  .oldreply{background:#F2F9D8;border-radius:9px;padding:10px;font-size:12px;
            white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
  .actions{display:flex;align-items:center;gap:10px;margin-top:10px}
  .msg{font-size:12px;color:var(--gray);min-height:18px}

  #toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;
         padding:11px 17px;border-radius:10px;font-size:13px;box-shadow:3px 3px 0 var(--lime);
         opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:99}
  #toast[data-on="true"]{opacity:1;transform:none}
  #viewer{position:fixed;inset:0;background:rgba(17,18,20,.88);display:none;
          align-items:center;justify-content:center;z-index:98;padding:24px;cursor:zoom-out}
  #viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  @media (max-width:860px){.cols{grid-template-columns:1fr}.list{max-height:320px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">晚</div>
    <div><h1>意见反馈 · 管理后台</h1><div class="sub">我的晚寝助手 · 反馈处理台</div></div>
    <span class="badge" id="mode">未连接</span>
  </header>

  <section class="gate" id="gate">
    <h1 style="font-size:17px;margin-bottom:6px">请输入管理口令</h1>
    <div class="sub" style="margin-bottom:18px">口令仅保存在当前标签页，关闭即失效</div>
    <input class="field" id="token" type="password" placeholder="管理口令" autocomplete="off">
    <button class="btn wide" id="enter">进入后台</button>
    <div class="hintline" id="gateErr"></div>
  </section>

  <main id="main" hidden>
    <div class="stats">
      <div class="stat"><b id="sTotal">—</b><span>全部反馈</span></div>
      <div class="stat"><b id="sPending">—</b><span>待处理</span></div>
      <div class="stat"><b id="sReplied">—</b><span>已回复</span></div>
    </div>
    <div class="toolbar">
      <button class="tab" data-filter="" data-on="true">全部</button>
      <button class="tab" data-filter="pending">待处理</button>
      <button class="tab" data-filter="replied">已回复</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="refresh">刷新</button>
      <button class="btn ghost" id="logout">退出</button>
    </div>
    <div class="cols">
      <section class="panel">
        <h3>反馈列表 <span class="muted" id="listHint">—</span></h3>
        <div class="list" id="list"></div>
      </section>
      <section class="panel">
        <h3>反馈详情 <span class="muted" id="detailHint">选择左侧一条反馈</span></h3>
        <div class="detail" id="detail"><div class="empty">还没有选中反馈</div></div>
      </section>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="viewer"><img alt="原图"></div>

<script>
(function(){
  var API = '/api/admin/feedbacks';
  var token = sessionStorage.getItem('dorm.admin.token') || '';
  var filter = '', currentId = null, items = [];
  var $ = function(id){ return document.getElementById(id); };
  var el = function(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.dataset.on = 'true';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.dataset.on = 'false'; }, 2600);
  }
  async function api(path, opts){
    opts = opts || {};
    var headers = { 'X-Admin-Token': token, 'Accept': 'application/json' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    var res = await fetch(API + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: 'no-store'
    });
    var payload = {};
    try { payload = await res.json(); } catch (e) {}
    if (!res.ok || payload.success === false) {
      var err = new Error(payload.msg || ('请求失败 ' + res.status));
      err.status = res.status;
      throw err;
    }
    return payload.data;
  }
  function fmt(v){ return v ? String(v).replace(/-/g, '/') : '—'; }
  function showMain(on){
    $('gate').hidden = on; $('main').hidden = !on;
    $('mode').textContent = on ? '已连接' : '未连接';
  }

  async function enter(){
    token = $('token').value.trim();
    $('gateErr').textContent = '';
    if (!token) { $('gateErr').textContent = '请先输入管理口令'; return; }
    $('enter').disabled = true; $('enter').textContent = '验证中…';
    try {
      await api('?limit=1');
      sessionStorage.setItem('dorm.admin.token', token);
      showMain(true);
      await loadList();
      toast('已进入后台');
    } catch (e) {
      $('gateErr').textContent = e.message || '验证失败';
      sessionStorage.removeItem('dorm.admin.token');
      token = '';
    } finally {
      $('enter').disabled = false; $('enter').textContent = '进入后台';
    }
  }

  async function loadList(){
    $('refresh').disabled = true; $('refresh').textContent = '加载中…';
    try {
      var data = await api('?limit=100' + (filter ? '&status=' + filter : ''));
      items = data.items || [];
      $('sTotal').textContent = data.total == null ? items.length : data.total;
      $('sPending').textContent = data.pending == null ? 0 : data.pending;
      $('sReplied').textContent = data.replied == null ? 0 : data.replied;
      renderList();
    } catch (e) {
      if (e.status === 403) { doLogout('登录已失效，请重新输入口令'); return; }
      toast(e.message || '列表加载失败');
    } finally {
      $('refresh').disabled = false; $('refresh').textContent = '刷新';
    }
  }
  function renderList(){
    var box = $('list'); box.textContent = '';
    $('listHint').textContent = '共 ' + items.length + ' 条';
    if (!items.length) { box.appendChild(el('div','empty','这个筛选下还没有反馈')); return; }
    items.forEach(function(it){
      var b = el('button','item');
      b.type = 'button';
      b.dataset.on = String(it.id === currentId);
      var r1 = el('div','row1');
      r1.appendChild(el('span','code',it.code));
      r1.appendChild(el('span','tag',it.type));
      var pill = el('span','pill',it.status === 'replied' ? '已回复' : '待处理');
      pill.dataset.s = it.status;
      r1.appendChild(pill);
      b.appendChild(r1);
      b.appendChild(el('div','excerpt',it.content.split('\n')[0] || '（无内容）'));
      var meta = '提交人 ' + (it.username || '—') + ' · ' + fmt(it.created_at) +
                 (it.image_count ? ' · ' + it.image_count + ' 张截图' : '');
      b.appendChild(el('div','meta',meta));
      b.addEventListener('click', function(){ openDetail(it.id); });
      box.appendChild(b);
    });
  }

  async function openDetail(id){
    currentId = id;
    renderList();
    $('detail').textContent = '';
    $('detailHint').textContent = '加载中…';
    try {
      var d = await api('/' + id);
      $('detailHint').textContent = d.code;
      renderDetail(d);
    } catch (e) {
      $('detailHint').textContent = '加载失败';
      $('detail').appendChild(el('div','empty',e.message || '详情加载失败'));
    }
  }

  function renderDetail(d){
    var box = $('detail'); box.textContent = '';
    var kv = el('div','kv');
    [['反馈编号', d.code], ['反馈类型', d.type], ['提交人', d.username || '—'],
     ['提交时间', fmt(d.created_at)], ['状态', d.status === 'replied' ? '已回复' : '待处理'],
     ['回复时间', fmt(d.replied_at)]].forEach(function(pair){
      var cell = el('div');
      cell.appendChild(el('small','',pair[0]));
      cell.appendChild(el('b','',pair[1]));
      kv.appendChild(cell);
    });
    box.appendChild(kv);

    box.appendChild(el('p','label','问题描述 / 截图'));
    box.appendChild(el('div','content',d.content || '（无内容）'));
    var images = d.images || [];
    if (images.length) {
      var shots = el('div','shots');
      images.forEach(function(src){
        if (typeof src !== 'string' || src.indexOf('data:image/') !== 0) return;
        var img = el('img'); img.src = src; img.alt = '反馈截图';
        img.addEventListener('click', function(){
          $('viewer').querySelector('img').src = src;
          $('viewer').style.display = 'flex';
        });
        shots.appendChild(img);
      });
      box.appendChild(shots);
    }

    var rb = el('div','replybox');
    rb.appendChild(el('p','label','官方回复'));
    if (d.status === 'replied' && d.reply) rb.appendChild(el('div','oldreply','已回复：' + d.reply));
    var ta = el('textarea');
    ta.placeholder = '输入给用户的回复，提交后 App 内会立刻显示「已回复」…';
    ta.maxLength = 2000;
    rb.appendChild(ta);
    var actions = el('div','actions');
    var btn = el('button','btn','提交回复');
    btn.type = 'button';
    var msg = el('span','msg','');
    btn.addEventListener('click', async function(){
      var text = ta.value.trim();
      if (!text) { msg.textContent = '回复内容不能为空'; return; }
      btn.disabled = true; btn.textContent = '提交中…'; msg.textContent = '';
      try {
        await api('/' + d.id + '/reply', { method:'POST', body:{ reply:text } });
        toast('回复成功，用户端已更新');
        await loadList();
        await openDetail(d.id);
      } catch (e) {
        msg.textContent = e.message || '提交失败';
      } finally {
        btn.disabled = false; btn.textContent = '提交回复';
      }
    });
    actions.appendChild(btn); actions.appendChild(msg);
    rb.appendChild(actions);
    box.appendChild(rb);
  }

  function doLogout(note){
    sessionStorage.removeItem('dorm.admin.token');
    token = ''; currentId = null;
    $('token').value = '';
    showMain(false);
    $('gateErr').textContent = note || '';
  }

  $('enter').addEventListener('click', enter);
  $('token').addEventListener('keydown', function(e){ if (e.key === 'Enter') enter(); });
  $('refresh').addEventListener('click', loadList);
  $('logout').addEventListener('click', function(){ doLogout(); toast('已退出'); });
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      filter = t.dataset.filter;
      document.querySelectorAll('.tab').forEach(function(x){ x.dataset.on = String(x === t); });
      loadList();
    });
  });
  $('viewer').addEventListener('click', function(){ this.style.display = 'none'; });

  if (token) { showMain(true); loadList(); } else { showMain(false); }
})();
</script>
</body>
</html>
