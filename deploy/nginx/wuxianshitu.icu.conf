# 域名站点 wuxianshitu.icu / www.wuxianshitu.icu
# 生成时间 20261112172059 · 源基线 01-ip-https.conf · 证书 /etc/nginx/certs/
server {
    listen 80;
    server_name wuxianshitu.icu www.wuxianshitu.icu;
    return 301 https://$host$request_uri;
}

# 域名 HTTPS：TrustAsia DV 证书；结构与 IP 站点一致（由 deploy_domain_2015.py 生成）
# 静态前端（React 构建产物）+ /api 反代到本机 8805 上的 FastAPI 后端
server {
    listen 443 ssl;
    http2 on;
    server_name wuxianshitu.icu www.wuxianshitu.icu;

    ssl_certificate     /etc/nginx/certs/wuxianshitu.icu_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/wuxianshitu.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /www/wwwroot/dorm-app-web/current;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---------- 后端接口：同源反代，前端用相对路径 /api/... ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8805;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # 后端自带文档 / 健康检查，便于线上排查
    location = /openapi.json { proxy_pass http://127.0.0.1:8805; proxy_set_header Host $host; }
    location = /healthz      { proxy_pass http://127.0.0.1:8805/health; proxy_set_header Host $host; }
    location /docs  { proxy_pass http://127.0.0.1:8805; proxy_set_header Host $host; }
    location /redoc { proxy_pass http://127.0.0.1:8805; proxy_set_header Host $host; }

    # ---------- 版本清单与安装包（独立于前端发布目录，发版不会覆盖） ----------
    location /update/ {
        alias /www/wwwroot/dorm-app-web/update/;
        autoindex off;
        add_header Cache-Control "no-cache";
        # 原生壳（Capacitor）页面 origin 是 https://localhost，
        # 拉版本清单、下载 APK 都属于跨域请求，必须放行 CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
        if ($request_method = OPTIONS) { return 204; }
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
    }


    # ---------- 测试版安装包（与正式更新通道完全隔离，不放 version.json） ----------
    location /beta/ {
        alias /www/wwwroot/dorm-app-web/beta/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }

    location /beta2/ {
        alias /www/wwwroot/dorm-app-web/beta2/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
    }

    location /beta3/ {
        alias /www/wwwroot/dorm-app-web/beta3/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
    }

    location /beta4/ {
        alias /www/wwwroot/dorm-app-web/beta4/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
    }

    location /beta5/ {
        alias /www/wwwroot/dorm-app-web/beta5/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
    }

    location /beta9/ {
        alias /www/wwwroot/dorm-app-web/beta9/;
        autoindex off;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) { return 204; }
        types { application/vnd.android.package-archive apk; }
    }

    location /beta11/ {
