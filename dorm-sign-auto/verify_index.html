<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚寝自动签到</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --line:#e3e9f2; --txt:#1f2d3d; --muted:#7a8aa0;
    --primary:#1d7dff; --primary-d:#0f62d6; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
    --radius:12px; --shadow:0 2px 10px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  /* ---------- 认证页 ---------- */
  .auth-card{max-width:400px;margin:9vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:32px}
  .auth-card h1{font-size:22px;margin-bottom:4px}
  .auth-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tab{flex:1;padding:9px;text-align:center;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#f8fafc;color:var(--muted);font-size:14px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none}
  .field input:focus{border-color:var(--primary)}
  .field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:#fff;color:var(--txt)}
  .field select:focus{border-color:var(--primary)}
  .btn{display:inline-block;padding:10px 18px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--primary-d)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn.ghost.danger{color:var(--err);border-color:var(--err)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn.block{width:100%}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
  /* ---------- 应用页 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .topbar .brand{font-size:20px;font-weight:600}
  .topbar .right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h2{font-size:16px;margin-bottom:14px}
  .card h2 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row .field{flex:1;min-width:140px;margin-bottom:0}
  .row .field label{margin-bottom:4px}
  .acc-line{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#f8fafc;border:1px dashed var(--line);border-radius:8px}
  .acc-line .info{flex:1}
  .acc-line .sid{font-weight:600}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px}
  .badge.once{background:#fff7ed;color:var(--warn);border:1px solid #fed7aa}
  .badge.daily{background:#eff6ff;color:var(--primary);border:1px solid #bfdbfe}
  .badge.on{background:#ecfdf5;color:var(--ok);border:1px solid #bbf7d0}
  .badge.off{background:#f1f5f9;color:var(--muted);border:1px solid #e2e8f0}
  .badge.success{background:#ecfdf5;color:var(--ok);border:1px solid #bbf7d0}
  .badge.failed,.badge.expired{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th{text-align:left;padding:9px 10px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  .table td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .table tr:last-child td{border-bottom:none}
  .empty{color:var(--muted);text-align:center;padding:22px;font-size:14px}
  .ops{display:flex;gap:6px;flex-wrap:wrap}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:24px;width:420px;max-width:92vw}
  .modal h3{margin-bottom:16px;font-size:16px}
  .modal .ops{margin-top:18px;justify-content:flex-end}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast-item{padding:10px 18px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:fadein .2s}
  .toast-item.ok{background:var(--ok)} .toast-item.err{background:var(--err)} .toast-item.info{background:var(--primary)}
  @keyframes fadein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .hidden{display:none!important}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:8px 16px;border:none;background:#fff;cursor:pointer;font-size:14px;color:var(--muted)}
  .seg button.active{background:var(--primary);color:#fff}
  code{background:#f1f5f9;padding:1px 6px;border-radius:4px;font-size:12px}
  /* ---------- 卡片化列表 ---------- */
  .list-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .list-item .li-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .list-item .li-time{font-size:18px;font-weight:700}
  .list-item .li-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:6px;flex-wrap:wrap}
  .list-item .li-line .sep{color:var(--line)}
  .list-item .li-msg{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-all}
  .list-item .li-note{color:var(--muted);font-size:13px;word-break:break-all;margin-bottom:2px}
  .list-item .li-ops{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center}
  html{-webkit-tap-highlight-color:transparent}
  @media (max-width:640px){
    .wrap{padding:14px 12px 80px}
    .auth-card{padding:24px 20px;margin:6vh auto 0}
    .card{padding:16px}
    .card h2{font-size:15px;margin-bottom:12px}
    .card h2 .hint{display:none}
    .row{flex-direction:column;gap:10px}
    .row .field{min-width:100%!important;width:100%}
    .row .field label{margin-bottom:5px}
    .topbar .brand{font-size:17px}
    .btn{min-height:44px}
    .btn.sm{min-height:36px;padding:8px 12px}
    .seg{display:flex;width:100%}
    .seg button{flex:1}
    .modal-mask{align-items:flex-end}
    .modal{width:100%;max-width:100%;border-radius:16px 16px 0 0;padding:20px 18px 28px}
    .tab{padding:11px}
  }
</style>
</head>
<body>
<div id="signStopBanner" style="background:#fff7ed;color:#9a3412;border-bottom:2px solid #f97316;padding:12px 16px;text-align:center;font-size:15px;font-weight:600;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">⚠️ 公告：该签到功能已停止使用，请勿再创建或依赖自动签到任务，感谢理解与配合！</div>
<div id="toast"></div>

<!-- ================= 认证页 ================= -->
<div id="authView" class="wrap">
  <div class="auth-card">
    <h1>晚寝自动签到</h1>
    <div class="sub">绑定晚寝账号，设置“一次 / 每天”自动签到</div>
    <div class="tabs">
      <div class="tab active" data-tab="login">登录</div>
      <div class="tab" data-tab="register">注册</div>
    </div>
    <form id="authForm">
      <div class="field"><label>用户名</label><input id="authUser" autocomplete="username" maxlength="32"></div>
      <div class="field"><label>密码</label><input id="authPass" type="password" autocomplete="current-password" maxlength="64"></div>
      <div class="field hidden" id="pass2Field"><label>确认密码</label><input id="authPass2" type="password" autocomplete="new-password" maxlength="64"></div>
      <button class="btn block" type="submit" id="authBtn">登 录</button>
      <div class="err" id="authErr"></div>
    </form>
  </div>
</div>

<!-- ================= 应用页 ================= -->
<div id="appView" class="wrap hidden">
  <div class="topbar">
    <div class="brand">🏠 晚寝自动签到</div>
    <div class="right">
      <span id="curUser"></span>
      <button class="btn ghost sm" onclick="logout()">退出</button>
    </div>
  </div>

  <!-- 晚寝账号 -->
  <div class="card">
    <h2>晚寝账号<span class="hint">用于自动签到的学号/密码，仅加密保存在本服务</span></h2>
    <div id="accBox"></div>
  </div>

  <!-- 位置信息 -->
  <div class="card">
    <h2>位置信息<span class="hint">提前记录签到位置，任务执行时直接使用</span></h2>
    <form id="locForm" class="row" style="margin-bottom:14px">
      <div class="field" style="min-width:100px"><label>名称</label><input id="lName" maxlength="32" placeholder="如：我的寝室"></div>
      <div class="field" style="min-width:120px"><label>纬度 lat</label><input id="lLat" placeholder="31.7061"></div>
      <div class="field" style="min-width:120px"><label>经度 lng</label><input id="lLng" placeholder="118.5070"></div>
      <div class="field" style="flex:2;min-width:160px"><label>地址（可选）</label><input id="lAddr" maxlength="64" placeholder="如：秀山校区 XX 楼 XX 室"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end">
        <button class="btn ghost sm" type="button" onclick="locFromTask()">从签到任务获取</button>
        <button class="btn sm" type="submit">保存位置</button>
      </div>
    </form>
    <div id="locList"></div>
    <div class="empty hidden" id="locEmpty">还没有记录位置，先记录一个，签到任务可直接使用</div>
  </div>

  <!-- 签到任务 -->
  <div class="card">
    <h2>签到任务<span class="hint">可创建多条，互不影响</span></h2>
    <form id="scheduleForm" class="row" style="margin-bottom:16px">
      <div class="field" style="min-width:100%">
        <label>模式</label>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="daily" class="active">每天</button>
          <button type="button" data-mode="once">一次</button>
        </div>
      </div>
      <div class="field"><label>签到时间</label><input id="fTime" type="time" required></div>
      <div class="field hidden" id="fDateField"><label>签到日期</label><input id="fDate" type="date"></div>
      <div class="field" style="min-width:150px"><label>签到位置</label><select id="fLoc"></select></div>
      <div class="field"><label>备注（可选）</label><input id="fRemark" maxlength="64" placeholder="如：周一晚 23:30"></div>
      <button class="btn" type="submit">添加任务</button>
    </form>
    <div id="scheduleList"></div>
    <div class="empty hidden" id="scheduleEmpty">还没有签到任务，先在上方添加一个吧</div>
  </div>

  <!-- 执行日志 -->
  <div class="card">
    <h2>执行日志</h2>
    <div id="logList"></div>
    <div class="empty hidden" id="logEmpty">暂无执行记录</div>
  </div>
</div>

<!-- ================= 绑定弹窗 ================= -->
<div class="modal-mask" id="bindMask">
  <div class="modal">
    <h3 id="bindTitle">绑定晚寝账号</h3>
    <form id="bindForm">
      <div class="field"><label>学号</label><input id="bSid" maxlength="32"></div>
      <div class="field"><label>晚寝系统密码</label><input id="bPwd" type="password" maxlength="64"></div>
      <div class="field"><label>备注昵称（可选）</label><input id="bNick" maxlength="32" placeholder="如：我的寝室"></div>
      <div class="ops">
        <button type="button" class="btn ghost" onclick="closeBind()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
      <div class="err" id="bindErr"></div>
    </form>
  </div>
</div>

<!-- ================= 编辑弹窗 ================= -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h3>编辑任务</h3>
    <form id="editForm">
      <input type="hidden" id="eId">
      <div class="field"><label>模式</label>
        <div class="seg" id="editModeSeg">
          <button type="button" data-mode="daily" class="active">每天</button>
          <button type="button" data-mode="once">一次</button>
        </div>
      </div>
      <div class="field"><label>签到时间</label><input id="eTime" type="time" required></div>
      <div class="field hidden" id="eDateField"><label>签到日期</label><input id="eDate" type="date"></div>
      <div class="field"><label>签到位置</label><select id="eLoc"></select></div>
      <div class="field"><label>备注</label><input id="eRemark" maxlength="64"></div>
      <div class="field"><label>状态</label>
        <div class="seg" id="eStateSeg">
          <button type="button" data-st="1" class="active">启用</button>
          <button type="button" data-st="0">停用</button>
        </div>
      </div>
      <div class="ops">
        <button type="button" class="btn ghost" onclick="closeEdit()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
      <div class="err" id="editErr"></div>
    </form>
  </div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('dorm_token') || '';
let CUR_USER = JSON.parse(localStorage.getItem('dorm_user') || 'null');
let curMode = 'daily';

// ---------- 工具 ----------
function $(id){return document.getElementById(id)}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(msg,type='info'){const t=document.createElement('div');t.className='toast-item '+type;t.textContent=msg;$('toast').appendChild(t);setTimeout(()=>t.remove(),2800)}
async function api(path,opts={}){
  const headers={'Content-Type':'application/json'};
  if(TOKEN)headers['Authorization']='Bearer '+TOKEN;
  const res=await fetch(API+path,{...opts,headers});
  let body={};
  try{body=await res.json()}catch(e){body={success:false,msg:'响应解析失败'}}
  if(res.status===401 && path!=='/api/auth/login'){showAuth();throw new Error('未登录或登录已过期')}
  return body;
}
function showAuth(){$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
function showApp(){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');loadAll()}

// ---------- 认证 ----------
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault();$('authErr').textContent='';
  const user=$('authUser').value.trim(),pass=$('authPass').value,pass2=$('authPass2').value;
  const isReg=$('authBtn').dataset.mode==='register';
  if(isReg && pass!==pass2){$('authErr').textContent='两次输入的密码不一致';return}
  if(!user||!pass){$('authErr').textContent='请输入用户名和密码';return}
  const path=isReg?'/api/auth/register':'/api/auth/login';
  const r=await api(path,{method:'POST',body:JSON.stringify({username:user,password:pass})});
  if(!r.success){$('authErr').textContent=r.msg;return}
  if(isReg){switchTab('login');$('authUser').value=user;toast('注册成功，请登录','ok')}
  else{
    TOKEN=r.data.token;CUR_USER={username:r.data.username};
    localStorage.setItem('dorm_token',TOKEN);localStorage.setItem('dorm_user',JSON.stringify(CUR_USER));
    showApp();toast('登录成功','ok');
  }
});
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  $('authBtn').textContent=t==='register'?'注 册':'登 录';
  $('authBtn').dataset.mode=t;
  $('pass2Field').classList.toggle('hidden',t!=='register');
  $('authErr').textContent='';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
function logout(){localStorage.removeItem('dorm_token');localStorage.removeItem('dorm_user');TOKEN='';CUR_USER=null;showAuth()}

// ---------- 模式分段按钮 ----------
function bindSeg(segId,onPick){
  const seg=$(segId);
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');onPick(b.dataset.mode||b.dataset.st);
  });
}
bindSeg('modeSeg',m=>{curMode=m;$('fDateField').classList.toggle('hidden',m!=='once');if(m==='once'&&!$('fDate').value)$('fDate').value=todayStr()});
bindSeg('editModeSeg',m=>{window._eMode=m;$('eDateField').classList.toggle('hidden',m!=='once')});
bindSeg('eStateSeg',st=>{window._eState=st==='1'});
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

// ---------- 晚寝账号 ----------
async function loadAccount(){
  const r=await api('/api/dorm-account');
  const box=$('accBox');
  if(!r.success||!r.data){
    box.innerHTML=`<div class="acc-line"><div class="info" style="color:var(--muted)">尚未绑定晚寝账号</div><button class="btn sm" onclick="openBind()">去绑定</button></div>`;
    return;
  }
  box.innerHTML=`<div class="acc-line">
    <div class="info"><span class="sid">${esc(r.data.student_id)}</span> ${r.data.nickname?('<span style="color:var(--muted)">· '+esc(r.data.nickname)+'</span>'):''}</div>
    <button class="btn ghost sm" onclick="openBind()">更换</button>
    <button class="btn ghost sm danger" onclick="unbind()">解绑</button>
  </div>`;
}
function openBind(){$('bindMask').classList.add('show');$('bSid').value='';$('bPwd').value='';$('bNick').value='';$('bindErr').textContent=''}
function closeBind(){$('bindMask').classList.remove('show')}
$('bindForm').addEventListener('submit',async e=>{
  e.preventDefault();$('bindErr').textContent='';
  const r=await api('/api/dorm-account',{method:'PUT',body:JSON.stringify({student_id:$('bSid').value.trim(),password:$('bPwd').value,nickname:$('bNick').value.trim()})});
  if(!r.success){$('bindErr').textContent=r.msg;return}
  closeBind();toast('晚寝账号绑定成功','ok');loadAccount();loadSchedules();
});
async function unbind(){
  if(!confirm('确定解绑晚寝账号？已创建的签到任务将失效。'))return;
  const r=await api('/api/dorm-account',{method:'DELETE'});
  if(r.success){toast('已解绑','ok');loadAccount();loadSchedules()}else toast(r.msg,'err');
}

// ---------- 位置信息 ----------
function locOpts(sel){
  const opts='<option value="">跟随任务位置（自动）</option>'+
    (window._locs||[]).map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.lat)}, ${esc(x.lng)})</option>`).join('');
  $(sel).innerHTML=opts;
}
async function loadLocations(){
  const r=await api('/api/locations');
  window._locs=(r.success&&r.data)||[];
  locOpts('fLoc');locOpts('eLoc');
  const list=$('locList');list.innerHTML='';
  if(!window._locs.length){$('locEmpty').classList.remove('hidden');return}
  $('locEmpty').classList.add('hidden');
  window._locs.forEach(l=>{
    const item=document.createElement('div');
    item.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;flex-wrap:wrap';
    item.innerHTML=`
      <div style="flex:1;min-width:170px">
        <span style="font-weight:600">${esc(l.name)}</span>
        ${l.is_default?'<span class="badge on" style="margin-left:6px">默认</span>':''}
        <div style="color:var(--muted);font-size:12px">${esc(l.lat)}, ${esc(l.lng)}${l.address?(' · '+esc(l.address)):''}</div>
      </div>
      <div class="ops">
        ${l.is_default?'':'<button class="btn ghost sm" onclick="setDefaultLoc('+l.id+')">设为默认</button>'}
        <button class="btn ghost sm danger" onclick="delLoc('+l.id+')">删除</button>
      </div>`;
    list.appendChild(item);
  });
}
$('locForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await api('/api/locations',{method:'POST',body:JSON.stringify({
    name:$('lName').value.trim(),lat:$('lLat').value.trim(),lng:$('lLng').value.trim(),address:$('lAddr').value.trim()})});
  if(!r.success){toast(r.msg,'err');return}
  toast('位置已记录','ok');
  $('lName').value='';$('lLat').value='';$('lLng').value='';$('lAddr').value='';
  loadLocations();
});
async function locFromTask(){
  const r=await api('/api/locations/from-task');
  if(!r.success){toast(r.msg,'err');return}
  $('lLat').value=r.data.lat;$('lLng').value=r.data.lng;
  if(!$('lAddr').value)$('lAddr').value=((r.data.dormName||'')+' '+(r.data.roomNo||'')).trim();
  toast('已从签到任务获取位置，点“保存位置”','ok');
}
async function setDefaultLoc(id){
  const r=await api('/api/locations/'+id+'/default',{method:'POST'});
  if(r.success){toast('已设为默认','ok');loadLocations()}else toast(r.msg,'err');
}
async function delLoc(id){
  if(!confirm('删除该位置？引用它的任务将改回“跟随任务位置”。'))return;
  const r=await api('/api/locations/'+id,{method:'DELETE'});
  if(r.success){toast('已删除','ok');loadLocations();loadSchedules()}else toast(r.msg,'err');
}

// ---------- 签到任务 ----------
$('scheduleForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const locVal=$('fLoc').value;
  const body={mode:curMode,sign_time:$('fTime').value,remark:$('fRemark').value.trim(),location_id:locVal?Number(locVal):null};
  if(curMode==='once')body.sign_date=$('fDate').value;
  const r=await api('/api/schedules',{method:'POST',body:JSON.stringify(body)});
  if(!r.success){toast(r.msg,'err');return}
  toast('任务已创建','ok');$('fRemark').value='';loadSchedules();
});
async function loadSchedules(){
  const r=await api('/api/schedules');
  const tb=$('scheduleList');tb.innerHTML='';
  if(!r.success||!r.data||!r.data.length){$('scheduleEmpty').classList.remove('hidden');return}
  $('scheduleEmpty').classList.add('hidden');
  r.data.forEach(s=>{
    const modeB=s.mode==='daily'?'<span class="badge daily">每天</span>':'<span class="badge once">一次 '+(s.sign_date||'')+'</span>';
    const stB=s.enabled?'<span class="badge on">启用</span>':'<span class="badge off">停用</span>';
    const locTxt=s.location
      ?(`<span>${esc(s.location.name)}</span>`)
      :'<span style="color:var(--muted)">跟随任务位置</span>';
    let last='<span style="color:var(--muted)">—</span>';
    let lastMsg='';
    if(s.last_status){
      const cls=s.last_status==='success'?'success':(s.last_status==='failed'||s.last_status==='expired'?'failed':'off');
      const txt=s.last_status==='success'?'成功':(s.last_status==='expired'?'已过期':'失败');
      last=`<span class="badge ${cls}">${txt}</span> <span>${esc(s.last_run_at||'')}</span>`;
      if(s.last_msg)lastMsg=`<div class="li-msg">${esc(s.last_msg)}</div>`;
    }
    const item=document.createElement('div');
    item.className='list-item';
    item.innerHTML=`<div class="li-top">
        ${modeB}<span class="li-time">${esc(s.sign_time)}</span>
        <span style="margin-left:auto">${stB}</span>
      </div>
      <div class="li-line">${locTxt}<span class="sep">·</span><span>下次 ${esc(s.next_run_at||'—')}</span></div>
      <div class="li-line">上次：${last}</div>
      ${lastMsg}
      ${s.remark?('<div class="li-note">备注：'+esc(s.remark)+'</div>'):''}
      <div class="li-ops">
        <button class="btn sm" onclick="runNow(${s.id})">立即签到</button>
        <button class="btn ghost sm" onclick="openEdit(${s.id})">编辑</button>
        <button class="btn ghost sm danger" onclick="delSchedule(${s.id})">删除</button>
      </div>`;
    tb.appendChild(item);
  });
}
async function runNow(id){
  const r=await api(`/api/schedules/${id}/run`,{method:'POST'});
  toast(r.msg||(r.data&&r.data.msg)||'已触发','info');
  setTimeout(loadAll,2500);
}
async function delSchedule(id){
  if(!confirm('确定删除该任务？'))return;
  const r=await api('/api/schedules/'+id,{method:'DELETE'});
  if(r.success){toast('已删除','ok');loadSchedules()}else toast(r.msg,'err');
}
function openEdit(id){
  const r=window._scheds||[];const s=r.find(x=>x.id===id);if(!s)return;
  window._eMode=s.mode;window._eState=!!s.enabled;
  $('eId').value=s.id;$('eTime').value=s.sign_time;$('eDate').value=s.sign_date||'';$('eRemark').value=s.remark||'';
  $('eLoc').value=s.location?s.location.id:'';
  $('editModeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===s.mode));
  $('eDateField').classList.toggle('hidden',s.mode!=='once');
  $('eStateSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.st===(s.enabled?'1':'0')));
  $('editErr').textContent='';$('editMask').classList.add('show');
}
function closeEdit(){$('editMask').classList.remove('show')}
$('editForm').addEventListener('submit',async e=>{
  e.preventDefault();$('editErr').textContent='';
  const id=$('eId').value;const locVal=$('eLoc').value;
  const body={mode:window._eMode,sign_time:$('eTime').value,enabled:window._eState,remark:$('eRemark').value.trim(),location_id:locVal?Number(locVal):null};
  if(window._eMode==='once')body.sign_date=$('eDate').value;
  const r=await api('/api/schedules/'+id,{method:'PUT',body:JSON.stringify(body)});
  if(!r.success){$('editErr').textContent=r.msg;return}
  closeEdit();toast('已保存','ok');loadSchedules();
});

// ---------- 日志 ----------
async function loadLogs(){
  const r=await api('/api/logs?limit=50');
  const tb=$('logList');tb.innerHTML='';
  if(!r.success||!r.data||!r.data.length){$('logEmpty').classList.remove('hidden');return}
  $('logEmpty').classList.add('hidden');
  r.data.forEach(l=>{
    const b=l.success?'<span class="badge success">成功</span>':'<span class="badge failed">失败</span>';
    const src=l.detail==='manual'?'手动':'自动';
    const msg=esc(l.msg||(l.success?'签到成功':'—'));
    const item=document.createElement('div');
    item.className='list-item';
    item.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px';
    item.innerHTML=`${b}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;word-break:break-all">${msg}</div>
        <div style="color:var(--muted);font-size:12px">${esc(l.run_at)} · ${src}</div>
      </div>`;
    tb.appendChild(item);
  });
}

// ---------- 初始化 ----------
async function loadAll(){
  await loadAccount();
  await loadLocations();
  const rs=await api('/api/schedules');window._scheds=(rs.success&&rs.data)||[];
  await loadSchedules();
  await loadLogs();
}
(async function init(){
  $('authBtn').dataset.mode='login';
  if(TOKEN&&CUR_USER){
    const r=await api('/api/auth/me');
    if(r.success){$('curUser').textContent=CUR_USER.username;showApp();setInterval(loadAll,15000);return}
  }
  TOKEN='';showAuth();
})();
</script>
</body>
</html>
