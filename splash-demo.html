<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启动动效对比 · 晚寝签到</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #23252b 0%, #0c0d10 60%);
    color: #e8e8ec;
    display: grid;
    place-items: center;
    min-height: 100%;
    padding: 28px 16px 40px;
    gap: 22px;
    grid-auto-rows: min-content;
  }
  .title { font-size: 13px; letter-spacing: 2px; color: #8a8a93; text-align: center; }
  .title b { color: #bef22f; letter-spacing: 1px; }

  .phone {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 9px #14151a, 0 0 0 11px #2b2c33, 0 50px 100px -30px rgba(0,0,0,.8);
    transform-origin: center;
  }
  @media (max-height: 900px) { .phone { transform: scale(.86); } }
  @media (max-height: 780px) { .phone { transform: scale(.72); } }

  /* ---------- 舞台 ---------- */
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .stage[data-v="a"] {
    --bg: radial-gradient(120% 90% at 50% 38%, #1b2010 0%, #131509 42%, #08090a 100%);
    --logo: #bef22f;
    --text: #eaf6c9;
    --sub: rgba(190,242,47,.55);
    --glow: rgba(190,242,47,.55);
    --line: rgba(190,242,47,.5);
    --star: rgba(190,242,47,.7);
  }
  .stage[data-v="b"] {
    --bg: #bef22f;
    --logo: #1a1a1a;
    --text: #1a1a1a;
    --sub: rgba(26,26,26,.5);
    --glow: transparent;
    --line: rgba(26,26,26,.25);
    --star: transparent;
  }
  .bg { position: absolute; inset: 0; background: var(--bg); }
  /* 夜间：底部一抹极淡的绿光晕，避免纯黑发闷 */
  .stage[data-v="a"] .bg::after {
    content: ""; position: absolute; left: 50%; top: 40%;
    width: 520px; height: 520px; margin: -260px 0 0 -260px;
    background: radial-gradient(circle, rgba(190,242,47,.10), rgba(190,242,47,0) 62%);
  }

  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--star); opacity: 0;
    animation: twinkle 3.6s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:.9; transform:scale(1);} }

  /* ---------- 内容 ---------- */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding-bottom: 40px;
  }
  .mark {
    position: relative; width: 118px; height: 141px;
    display: grid; place-items: center;
    filter: drop-shadow(0 0 30px var(--glow));
    animation: markIn 900ms cubic-bezier(.16,1,.3,1) both;
  }
  .mark svg { display: block; }
  .mark path { fill: var(--logo); }
  .stage[data-v="a"] .mark::before {
    content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(190,242,47,.22), rgba(190,242,47,0) 65%);
    animation: bloom 2.6s ease-in-out infinite;
  }
  @keyframes bloom { 0%,100%{ transform:scale(.9); opacity:.5;} 50%{ transform:scale(1.12); opacity:.9;} }
  @keyframes markIn {
    0% { opacity: 0; transform: scale(.6) translateY(6px); filter: blur(12px) drop-shadow(0 0 0 transparent); }
    55% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .word {
    font-size: 30px; font-weight: 700; letter-spacing: 10px;
    padding-left: 10px; color: var(--text);
    text-shadow: 0 0 24px var(--glow);
    animation: rise 700ms cubic-bezier(.16,1,.3,1) 220ms both;
  }
  .sub {
    margin-top: -18px; font-size: 11px; letter-spacing: 5px;
    color: var(--sub); font-family: "Poppins", system-ui, sans-serif;
    animation: rise 700ms cubic-bezier(.16,1,.3,1) 380ms both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .loader {
    position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%);
    width: 64px; height: 3px; border-radius: 2px; overflow: hidden;
    background: rgba(255,255,255,.10);
    animation: fadeIn 500ms ease 700ms both;
  }
  .loader i { position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--line); animation: slide 1.1s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes slide { 0%{ transform: translateX(-120%);} 100%{ transform: translateX(260%);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

  /* ---------- 控制条 ---------- */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    border: 0; cursor: pointer; font: inherit;
    padding: 10px 18px; border-radius: 12px;
    background: #1b1d22; color: #cfd0d6;
    font-size: 13px; letter-spacing: .5px;
    box-shadow: inset 0 0 0 1px #2c2f37;
    transition: all .18s ease;
  }
  button[data-on="true"] { background: #bef22f; color: #14151a; font-weight: 700; box-shadow: none; }
  button:active { transform: scale(.96); }
  .spec {
    max-width: 520px; text-align: center; font-size: 12px; line-height: 20px; color: #71737d;
  }
  .spec code { color: #9fa2ad; }

  /* 系统「减弱动效」：降级为纯静态，不播放位移/发光循环 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <div class="title">启动动效对比 · <b>晚寝签到</b>（点按钮切换 / 重播）</div>

  <div class="phone">
    <div class="stage" id="stage" data-v="a">
      <div class="bg"></div>
      <div class="stars" id="stars"></div>
      <div class="content">
        <div class="mark">
          <svg viewBox="0 0 107 128" width="118" height="141" fill="none" aria-hidden="true">
            <path d="M15.5626 90.0426L14.4934 88.9364C2.1728 75.9639 -2.8166 57.9131 1.5619 40.0634C6.5512 19.4986 24.2176 3.6601 45.3968 0.593C78.4894 -4.234 107 21.0573 107 52.8348C107 68.9246 96.8686 87.3274 83.7843 97.7858C82.1042 99.1434 79.6095 98.8417 78.184 97.2327L65.9652 83.7072C64.0814 81.6959 64.5396 78.4277 66.9834 77.0701C73.8056 73.1482 79.1513 66.8128 80.8823 59.1701C85.3625 39.2086 67.9507 21.7109 47.7897 25.7334C37.1491 27.8452 28.4941 36.2421 26.1522 46.7005C24.1157 55.9522 26.7631 65.1536 33.0762 71.6901L36.5382 75.26L36.4364 75.3606L68.7653 109.501C70.3945 111.211 70.2927 113.976 68.5617 115.585L56.4447 126.798C54.6119 128.457 51.7608 128.407 50.0807 126.597L15.6135 90.1934L15.5626 90.0426Z"/>
          </svg>
        </div>
        <div class="word">晚寝签到</div>
        <div class="sub">NIGHT · CHECK-IN</div>
      </div>
      <div class="loader"><i></i></div>
    </div>
  </div>

  <div class="controls">
    <button data-v="a" data-on="true">A · 夜间微光（推荐）</button>
    <button data-v="b">B · 柠檬底（当前）</button>
    <button id="replay">↻ 重播</button>
  </div>

  <div class="spec">
    时长 <code>≈1.6s</code> · 揭示曲线 <code>cubic-bezier(.16,1,.3,1)</code> · Logo <code>#BEF22F</code> + 30px 发光 · 背景 <code>#0A0B0A</code> 径向<br>
    参考：Spotify（墨底亮标）/ TikTok（霓虹呼吸）/ Netflix（暗场揭示）· 支持「减弱动效」时降级为纯淡入
  </div>

<script>
  var stage = document.getElementById('stage');
  var starsBox = document.getElementById('stars');
  // 生成星点
  for (var i = 0; i < 18; i++) {
    var s = document.createElement('i');
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 78) + '%';
    s.style.animationDelay = (Math.random() * 3.6) + 's';
    s.style.opacity = 0;
    starsBox.appendChild(s);
  }

  function replay() {
    var content = document.querySelector('.content');
    var loader = document.querySelector('.loader');
    // 重新触发 CSS 动画
    [content, loader].forEach(function (el) {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
    content.querySelectorAll('.mark, .word, .sub').forEach(function (el) {
      var a = el.style.animation;
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = a || '';
    });
  }

  document.querySelectorAll('button[data-v]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('button[data-v]').forEach(function (x) { x.dataset.on = 'false'; });
      b.dataset.on = 'true';
      stage.dataset.v = b.dataset.v;
      replay();
    });
  });
  document.getElementById('replay').addEventListener('click', replay);

  // 每 2.8s 自动循环一次
  setInterval(replay, 2800);
</script>
</body>
</html>
